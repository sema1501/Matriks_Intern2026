server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Profil fotoğrafı gibi yüklemeler için API'nin kabul ettiği boyutu nginx kesmesin.
    client_max_body_size 10m;

    # Gerçek istemci IP'si API'ye iletilir (rate limiting IP başına çalışıyor).
    # $proxy_add_x_forwarded_for değil $remote_addr: istemcinin yolladığı sahte değer ezilir.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;

    location /api/ {
        proxy_pass http://api:5002;
    }

    # SignalR. Upgrade ve Connection başlıkları olmazsa bağlantı WebSocket'e yükselemez,
    # yavaş olan yedek yönteme düşer. Uzun süre açık kaldığı için zaman aşımı da uzun.
    location /hubs/ {
        proxy_pass http://api:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
        # WebSocket'te access token adreste gidiyor, erişim loguna yazılmasın.
        access_log off;
    }

    # React Router: bilinmeyen yollar index.html'e gider, yoksa /portfolio yenilenince 404 alınır.
    location / {
        try_files $uri /index.html;
    }
}
